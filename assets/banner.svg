<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="Syd Shawarira banner" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset=".55" stop-color="#1b1035"/><stop offset="1" stop-color="#0b0f1a"/></linearGradient>
  <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4d8d"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  <clipPath id="clip"><rect width="900" height="290" rx="18"/></clipPath>
</defs>
<style>
  .sl{animation-name:slide;animation-iteration-count:infinite;animation-timing-function:linear}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(1400px)}}
  .name{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  .glow{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.65}}
  .sub{animation:rise 1s .5s cubic-bezier(.2,.8,.2,1) both}
  .pill{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
  @keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
  .road-dash{animation:dash .6s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-48}}
  .car{animation:drive 7s linear infinite}
  @keyframes drive{from{transform:translateX(-170px)}to{transform:translateX(1070px)}}
  .wheel{animation:spin .5s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .beam{animation:flick 1.4s ease-in-out infinite}
  @keyframes flick{0%,100%{opacity:.55}50%{opacity:.9}}
  .ball{animation:bounce 1.5s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}50%{transform:translateY(-118px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}}
  .ballspin{animation:spin 1.5s linear infinite;transform-box:fill-box;transform-origin:center}
  .shadow{animation:sh 1.5s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes sh{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.5);opacity:.2}}
  .blink{animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
</style>
<g clip-path="url(#clip)">
  <rect width="900" height="290" fill="url(#bg)"/>
  <rect class="sl" x="-300" y="92" width="118" height="2" rx="1" fill="#ff4d8d" opacity="0.24" style="animation-duration:2.63s;animation-delay:0.14s"/>
<rect class="sl" x="-300" y="24" width="209" height="2" rx="1" fill="#fb923c" opacity="0.17" style="animation-duration:2.16s;animation-delay:0.26s"/>
