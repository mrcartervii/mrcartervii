<rect class="sl" x="-300" y="66" width="91" height="2" rx="1" fill="#fb923c" opacity="0.19" style="animation-duration:3.05s;animation-delay:0.4s"/>
<rect class="sl" x="-300" y="40" width="226" height="2" rx="1" fill="#22d3ee" opacity="0.18" style="animation-duration:2.4s;animation-delay:2.45s"/>
<rect class="sl" x="-300" y="156" width="243" height="2" rx="1" fill="#ff4d8d" opacity="0.29" style="animation-duration:2.09s;animation-delay:0.29s"/>
<rect class="sl" x="-300" y="168" width="132" height="2" rx="1" fill="#a78bfa" opacity="0.27" style="animation-duration:2.89s;animation-delay:1.6s"/>
<rect class="sl" x="-300" y="126" width="172" height="2" rx="1" fill="#22d3ee" opacity="0.17" style="animation-duration:2.38s;animation-delay:2.38s"/>
<rect class="sl" x="-300" y="86" width="214" height="2" rx="1" fill="#fb923c" opacity="0.22" style="animation-duration:2.89s;animation-delay:1.03s"/>
<rect class="sl" x="-300" y="28" width="110" height="2" rx="1" fill="#a78bfa" opacity="0.19" style="animation-duration:2.93s;animation-delay:0.49s"/>
<rect class="sl" x="-300" y="135" width="187" height="2" rx="1" fill="#a78bfa" opacity="0.24" style="animation-duration:1.7s;animation-delay:2.0s"/>
<rect class="sl" x="-300" y="99" width="232" height="2" rx="1" fill="#ff4d8d" opacity="0.36" style="animation-duration:2.89s;animation-delay:2.39s"/>
<rect class="sl" x="-300" y="79" width="201" height="2" rx="1" fill="#a78bfa" opacity="0.31" style="animation-duration:3.41s;animation-delay:0.19s"/>

  <text class="glow" x="50" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="900" fill="url(#tx)" filter="url(#glow)" letter-spacing="2">SYD SHAWARIRA</text>
  <g class="name"><text x="50" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="900" fill="url(#tx)" letter-spacing="2">SYD SHAWARIRA</text></g>
  <g class="sub"><text x="52" y="150" font-family="'Fira Code','Consolas','Courier New',monospace" font-size="14" fill="#cbd5e1" letter-spacing="3">ICT UNDERGRADUATE  //  ARRUPE JESUIT UNIVERSITY<tspan class="blink" fill="#22d3ee"> _</tspan></text></g>
  <g class="pill" style="animation-delay:1.2s"><rect x="52" y="160" width="79" height="28" rx="14" fill="#0b0f1a" stroke="#ff4d8d" stroke-width="1.5"/><text x="91.5" y="179" text-anchor="middle" font-family="'Fira Code','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#ff4d8d">ANIME</text></g>
<g class="pill" style="animation-delay:1.38s"><rect x="143" y="160" width="79" height="28" rx="14" fill="#0b0f1a" stroke="#a78bfa" stroke-width="1.5"/><text x="182.5" y="179" text-anchor="middle" font-family="'Fira Code','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#a78bfa">GAMES</text></g>
<g class="pill" style="animation-delay:1.56s"><rect x="234" y="160" width="68" height="28" rx="14" fill="#0b0f1a" stroke="#fb923c" stroke-width="1.5"/><text x="268.0" y="179" text-anchor="middle" font-family="'Fira Code','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#fb923c">CARS</text></g>
<g class="pill" style="animation-delay:1.74s"><rect x="314" y="160" width="79" height="28" rx="14" fill="#0b0f1a" stroke="#22d3ee" stroke-width="1.5"/><text x="353.5" y="179" text-anchor="middle" font-family="'Fira Code','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#22d3ee">MUSIC</text></g>
<g class="pill" style="animation-delay:1.92s"><rect x="405" y="160" width="57" height="28" rx="14" fill="#0b0f1a" stroke="#34d399" stroke-width="1.5"/><text x="433.5" y="179" text-anchor="middle" font-family="'Fira Code','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#34d399">ICT</text></g>
<g class="pill" style="animation-delay:2.0999999999999996s"><rect x="474" y="160" width="134" height="28" rx="14" fill="#0b0f1a" stroke="#fde68a" stroke-width="1.5"/><text x="541.0" y="179" text-anchor="middle" font-family="'Fira Code','Consolas','Courier New',monospace" font-size="13" font-weight="700" fill="#fde68a">VOLLEYBALL</text></g>

  <!-- volleyball -->
  <ellipse class="shadow" cx="805" cy="236" rx="30" ry="4" fill="#000"/>
  <g transform="translate(805,206)"><g class="ball"><g class="ballspin">
    <circle r="28" fill="#fde68a"/>
    <path d="M-28 0 Q0 -14 28 0 M-20 -20 Q-4 4 -12 26 M20 -20 Q4 4 12 26" fill="none" stroke="#fb923c" stroke-width="3"/>
    <circle r="28" fill="none" stroke="#fb923c" stroke-width="2.5"/>
  </g></g></g>
  <!-- road -->
  <rect y="238" width="900" height="52" fill="#06080f"/>
  <line x1="0" y1="266" x2="900" y2="266" stroke="#fde68a" stroke-width="3" stroke-dasharray="24 24" opacity=".6" class="road-dash"/>
  <line x1="0" y1="238" x2="900" y2="238" stroke="#22d3ee" stroke-width="2" opacity=".7"/>
  <!-- car -->
  <g transform="translate(0,197)"><g class="car">
    <polygon class="beam" points="132,24 215,8 215,40" fill="#fde68a"/>
    <path d="M5 30 L5 22 Q5 18 12 16 L40 12 Q55 -2 85 -2 Q105 -2 112 12 L125 16 Q132 18 132 24 L132 30 Z" fill="#ff4d8d"/>
    <path d="M48 12 Q58 2 80 2 L84 12 Z M90 12 L88 2 Q102 3 108 12 Z" fill="#0b0f1a" opacity=".75"/>
    <rect x="124" y="19" width="8" height="5" rx="2" fill="#fde68a"/>
    <rect x="3" y="19" width="6" height="5" rx="2" fill="#ef4444"/>
    <g transform="translate(35,32)"><circle r="11" fill="#111" stroke="#22d3ee" stroke-width="2"/><g class="wheel"><path d="M-8 0H8M0 -8V8" stroke="#22d3ee" stroke-width="2"/></g></g>
    <g transform="translate(102,32)"><circle r="11" fill="#111" stroke="#22d3ee" stroke-width="2"/><g class="wheel"><path d="M-8 0H8M0 -8V8" stroke="#22d3ee" stroke-width="2"/></g></g>
  </g></g>
</g>
